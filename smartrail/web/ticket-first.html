<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出票优先策略 · 无相邻座位时怎么办</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141b24; --panel2:#1b2430; --line:#28323f;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4c9aff;
    --ok:#35c46a; --warn:#e3b341; --bad:#f85149;
    --quiet:#7b61ff; --acc:#16b8bf; --pax:#4c9aff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0 0 4px;font-weight:600}
  header .sub{color:var(--muted);font-size:12.5px}
  main{padding:14px 22px 60px;display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
            margin:0 0 10px;font-weight:600}
  .principle{display:flex;gap:14px;flex-wrap:wrap}
  .principle > div{flex:1 1 260px;background:var(--panel2);border-radius:9px;padding:11px 13px;
                   border-left:3px solid var(--accent)}
  .principle b{display:block;margin-bottom:3px}
  .principle .muted{font-size:12.5px}
  .scenarios{display:flex;gap:8px;flex-wrap:wrap}
  .scenarios button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
                    border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;text-align:left}
  .scenarios button:hover{border-color:var(--accent)}
  .scenarios button.active{border-color:var(--accent);background:#1d2c3f;font-weight:600}
  .scenarios button .lvl{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .grid{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(300px,1fr);gap:14px}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px;margin-bottom:12px}
  .metric{background:var(--panel2);border-radius:8px;padding:9px 11px}
  .metric .k{font-size:11.5px;color:var(--muted)}
  .metric .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;border:1px solid}

  .cars{display:flex;flex-direction:column;gap:9px;max-height:460px;overflow:auto}
  .car{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .car.quiet{border-color:var(--quiet)} .car.acc{border-color:var(--acc)}
  .car-head{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
  .car-head b{color:var(--text);font-size:12.5px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10.5px}
  .tag.quiet{border-color:var(--quiet);color:var(--quiet)}
  .tag.acc{border-color:var(--acc);color:var(--acc)}
  .seats{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r),auto);gap:2px;overflow-x:auto}
  .seat{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:#10161d;
        font-size:8px;display:flex;align-items:center;justify-content:center;color:#0b0f14;font-weight:700}
  .seat.occ{background:#2b3542;border-color:#2b3542}
  .seat.free{border-color:#3a4757}
  .seat.assigned{background:var(--pax);border-color:var(--pax);cursor:pointer}
  .seat.quietf:not(.occ):not(.assigned){border-color:var(--quiet)}
  .seat.accf:not(.occ):not(.assigned){border-color:var(--acc)}
  .legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .notice{border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--panel2);
          border-left:3px solid var(--muted)}
  .notice.action{border-left-color:var(--bad)}
  .notice.attention{border-left-color:var(--warn)}
  .notice.info{border-left-color:var(--accent)}
  .notice .head{display:flex;gap:8px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
  .notice .who{font-weight:600}
  .notice .msg{font-size:13px;color:#cfd9e4}
  .notice .act{margin-top:6px;font-size:12.5px;color:var(--accent)}
  .muted{color:var(--muted)}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border-radius:8px;
      padding:10px;font-size:12px;margin:0;max-height:230px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .banner{margin:12px 22px 0;padding:9px 12px;border-radius:8px;font-size:12.5px;
          border:1px solid var(--line);background:var(--panel)}
</style>
</head>

      <div>

  <section class="panel">
    <h2>选择场景</h2>
    <div id="scenarios" class="scenarios"></div>
  </section>

  <div class="grid">

      <h2>座位图</h2>
      <div class="legend">
        <span><i style="background:var(--pax)"></i>本单乘客</span>

    <section class="panel">

      <div id="metrics" class="metrics"></div>
      <div id="notices"></div>
      <div id="notes"></div>
    </section>
  </div>

  <section class="panel">
    <h2>全部场景对照</h2>
    <div id="summary"></div>
  </section>
</main>

<script>
const DATA = JSON.parse(document.getElementById("tf-data").textContent);
const SCENARIOS = DATA.scenarios || [];
// 布局（座位 + 车厢）全场景共用一份，场景只存差异，避免快照重复膨胀
const LAYOUT = DATA.layout || { seats: [], carriages: [] };
const $ = (id) => document.getElementById(id);
let current = 0;

const LEVEL_TEXT = {
  satisfied: "相邻已满足",
  compromised: "未相邻，但本车厢还有相邻空位",
  impossible: "本车厢已无相邻空位",
};

function seatMapFor(scenario) {
  const assigned = {};
  for (const a of scenario.assignments) assigned[a.seat_id] = a.passenger_id;
  // 已占座位以 ID 列表单独传入，页面自行组装成集合：
  // 1156 个座位如果每个都带 x 标记，快照会膨胀数倍（真实踩过）。
  const occupied = new Set(scenario.occupied_seats || []);
  const container = $("seatmap");
  container.innerHTML = "";
  // 只画有乘客的车厢 + 无障碍车厢，避免 16 节全铺导致滚动过长
  const wanted = new Set(scenario.assignments.map((a) => a.carriage));
  for (const car of LAYOUT.carriages) {
    if (!wanted.has(car.number) && !car.accessible) continue;
    const seats = LAYOUT.seats.filter((s) => s.c === car.number);
    if (!seats.length) continue;
    const card = document.createElement("div");
    card.className = "car" + (car.quiet ? " quiet" : "") + (car.accessible ? " acc" : "");
    const head = document.createElement("div");
    head.className = "car-head";
    head.innerHTML = `<b>${String(car.number).padStart(2, "0")} 车</b>
      <span>${car.class_code || ""}</span><span>${car.rows} 排 × ${(car.columns || []).length} 列</span>
      ${car.quiet ? '<span class="tag quiet">静音</span>' : ""}
      ${car.accessible ? '<span class="tag acc">无障碍</span>' : ""}`;
    card.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "seats";
    grid.style.setProperty("--r", String(car.rows));
    for (const seat of seats) {
      const cell = document.createElement("div");
      const cls = ["seat"];
      const who = assigned[seat.i];
      const isOccupied = occupied.has(seat.i);
      if (who) cls.push("assigned");
      else if (isOccupied) cls.push("occ");
      else cls.push("free");
      if (seat.q) cls.push("quietf");
      if (seat.a) cls.push("accf");
      cell.className = cls.join(" ");
      cell.textContent = who ? who.slice(0, 2) : "";
      cell.title = `${seat.i}${who ? " ← " + who : isOccupied ? "（已占）" : "（空）"}`;
      grid.appendChild(cell);
    }
    card.appendChild(grid);
    container.appendChild(card);
  }
  if (!container.children.length) {
    container.innerHTML = '<div class="muted">该场景没有座位图数据。</div>';
  }
}

function renderMetrics(scenario) {
  const seated = scenario.assignments.length;
  const total = seated + scenario.waitlisted.length;
  const lvl = scenario.adjacency_level;
  $("metrics").innerHTML = `
    <div class="metric"><div class="k">相邻结论</div>
      <div class="v"><span class="pill ${lvl}">${LEVEL_TEXT[lvl] || lvl}</span></div></div>
    <div class="metric"><div class="k">出票 / 请求</div>
      <div class="v">${seated} / ${total}</div></div>
    <div class="metric"><div class="k">候补（拒票）</div>
      <div class="v" style="color:${scenario.waitlisted.length ? "var(--bad)" : "var(--ok)"}">${scenario.waitlisted.length}</div></div>
    <div class="metric"><div class="k">Tier 0 违规</div>
      <div class="v" style="color:${scenario.tier0 ? "var(--bad)" : "var(--ok)"}">${scenario.tier0}</div></div>
    <div class="metric"><div class="k">车厢占用率</div>
      <div class="v">${(scenario.occupancy * 100).toFixed(0)}%</div></div>
    <div class="metric"><div class="k">本车厢还有相邻空位</div>
      <div class="v" style="color:${scenario.adjacent_pair_available ? "var(--ok)" : "var(--bad)"}">
        ${scenario.adjacent_pair_available ? "有" : "无"}</div></div>
    <div class="metric"><div class="k">求解耗时</div>
      <div class="v">${scenario.elapsed_ms.toFixed(1)} ms</div></div>`;
}

function renderNotices(scenario) {
  const box = $("notices");
  if (!scenario.notices.length) {
    box.innerHTML = '<div class="notice info"><div class="msg">本单无需现场处理的提示（相邻已满足）。</div></div>';
  } else {
    box.innerHTML = scenario.notices.map((n) => `
      <div class="notice ${n.level}">
        <div class="head">
          <span class="who">${n.passenger_id === "__order__" ? "整单" : n.passenger_id}</span>
          <span class="tag">${n.kind}</span>
          <span class="tag">${n.level}</span>
          ${n.seat_id ? `<span class="muted">座位 ${n.seat_id}</span>` : ""}
        </div>
        <div class="msg">${n.message}</div>
        ${n.companions && n.companions.length ? `<div class="act">需与 ${n.companions.join("、")} 坐到一起</div>` : ""}
      </div>`).join("");
  }
  const seatLines = scenario.assignments
    .map((a) => `${a.passenger_id} → ${a.seat_id}${a.accessible ? "（无障碍）" : ""}${a.quiet ? "（静音）" : ""}`)
    .join("　");
  $("notes").innerHTML = `<pre>座位：${seatLines}\n代价：${scenario.total_cost}\n` +
    (scenario.notes.length ? scenario.notes.join("\n") : "（无补充说明）") + "</pre>";
}

function renderSummary() {
  const head = `<tr><th>场景</th><th>相邻结论</th><th class="num">出票</th><th class="num">拒票</th>
    <th class="num">Tier 0</th><th class="num">本车厢有相邻空位</th><th class="num">占用率</th></tr>`;
  const rows = SCENARIOS.map((s, i) => `
    <tr style="cursor:pointer" onclick="select(${i})">
      <td>${s.title}</td>
      <td><span class="pill ${s.adjacency_level}">${LEVEL_TEXT[s.adjacency_level] || s.adjacency_level}</span></td>
      <td class="num">${s.assignments.length}</td>
      <td class="num" style="color:${s.waitlisted.length ? "var(--bad)" : "var(--ok)"}">${s.waitlisted.length}</td>
      <td class="num" style="color:${s.tier0 ? "var(--bad)" : "var(--ok)"}">${s.tier0}</td>
      <td class="num">${s.adjacent_pair_available ? "有" : "无"}</td>
      <td class="num">${(s.occupancy * 100).toFixed(0)}%</td>
    </tr>`).join("");
  $("summary").innerHTML = `<table>${head}${rows}</table>
    <div class="muted" style="margin-top:8px;font-size:12.5px">
      全部场景均为 <b>0 拒票</b>：即使车厢内已不存在任何相邻空位，系统仍然出票并生成"上车找列车员"的提示。
    </div>`;
}

function select(index) {
  current = index;
  const scenario = SCENARIOS[index];
  document.querySelectorAll("#scenarios button").forEach((button, i) => {
    button.classList.toggle("active", i === index);
  });
  seatMapFor(scenario);
  renderMetrics(scenario);
  renderNotices(scenario);
}

function boot() {
  if (!SCENARIOS.length) {
    $("banner").innerHTML = "未找到场景数据。请运行 <code>python -m smartrail.report --inject-ticket-first</code> 生成。";
    return;
  }
  $("scenarios").innerHTML = SCENARIOS.map((s, i) => `
    <button data-i="${i}">
      ${s.title}
      <span class="lvl">出票 ${s.assignments.length} · 拒票 ${s.waitlisted.length} · ${LEVEL_TEXT[s.adjacency_level] || s.adjacency_level}</span>
    </button>`).join("");
  document.querySelectorAll("#scenarios button").forEach((button) => {
    button.onclick = () => select(Number(button.dataset.i));
  });
  renderSummary();
  select(0);
  const stamp = DATA.generated_at || "未知";
  $("banner").innerHTML = `数据来源：<b>真实求解快照</b>（生成于 ${stamp}，Python ${DATA.python || "?"}）。
    每个场景都是实际跑出来的分配结果，页面只做渲染。`;
}

boot();
</script>
</body>
</html>
