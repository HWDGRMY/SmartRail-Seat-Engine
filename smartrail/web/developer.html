<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发者模式 · SmartRail</title>
<style>
  :root{
    --blue:#3b8eea; --blue-d:#2f7ad0; --bg:#f2f4f7; --card:#fff;
    --ink:#333; --muted:#7b8794; --line:#e9edf2; --ok:#2eab5b;
    --warn:#e6a23c; --bad:#e5504a; --quiet:#6d5bd0; --access:#16a3a3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  .topbar{background:linear-gradient(90deg,#2b3a4d,#3d5169);color:#fff;
    padding:12px 26px;display:flex;align-items:center;gap:18px}
  .topbar h1{margin:0;font-size:17px;font-weight:600}
  .topbar .nav{display:flex;gap:12px;font-size:13.5px;margin-left:auto;align-items:center}
  .topbar .nav a{color:#dbe4ee;padding:4px 10px;border-radius:5px;text-decoration:none}
  .topbar .nav a.active,.topbar .nav a:hover{background:rgba(255,255,255,.16);color:#fff}
  .wrap{max-width:1560px;margin:0 auto;padding:16px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    margin-bottom:14px;overflow:hidden}
  .card > h2{margin:0;padding:12px 16px;font-size:14.5px;font-weight:600;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card > h2 .hint{font-weight:400;font-size:12px;color:var(--muted)}
  .card .body{padding:14px 16px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{border:0;border-radius:6px;background:var(--blue);color:#fff;padding:7px 15px;
    font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:#556}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue-d)}
  .btn.danger{background:var(--bad)}
  .btn.danger:hover{background:#cf443e}
  .btn.small{padding:4px 10px;font-size:12px}
  .hint{color:var(--muted);font-size:12.5px}
  .grid2{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
  @media (max-width:1200px){.grid2{grid-template-columns:1fr}}
  .metrics{display:flex;flex-wrap:wrap;gap:22px}
  .metric .k{font-size:11.5px;color:var(--muted)}
  .metric .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:500;font-size:11.5px;background:#fbfcfd}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  /* ---- 余票滑块 ---- */
  .slider{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .slider .nm{width:64px;font-size:13px;font-weight:600}
  .slider input[type=range]{flex:1}
  .slider .val{width:56px;text-align:right;font-variant-numeric:tabular-nums;
    font-weight:600;font-size:13.5px}
  .slider .total{width:64px;color:var(--muted);font-size:11.5px}
  /* ---- 座位图 ---- */
  .car{border:1px solid var(--line);border-radius:8px;margin-bottom:11px;overflow:hidden}
  .car-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fbfcfd;
    border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .car-head b{font-size:14px}
  .car-body{padding:10px 12px;overflow:auto}
  .seatgrid{display:inline-block;min-width:100%}
  .srow{display:flex;align-items:center;gap:2px;margin-bottom:2px}
  .rno{width:26px;font-size:10.5px;color:var(--muted);text-align:right;
    flex:0 0 auto;font-variant-numeric:tabular-nums}
  .seat{width:25px;height:21px;border-radius:3px;border:1px solid #cfd6de;background:#fff;
    flex:0 0 auto;font-size:9px;display:flex;align-items:center;justify-content:center;
    color:#98a2ae;position:relative;cursor:default}
  .seat.sold{background:#9fb2c6;border-color:#8ea3ba;color:#fff}
  .seat.manual{background:#d9c7a8;border-color:#c8b394;color:#6b5a3d}
  .seat.preset{background:#c9d4e0;border-color:#b7c4d3;color:#5a6a7c}
  .seat.quiet{outline:2px solid var(--quiet);outline-offset:-2px}
  .seat.access{box-shadow:inset 0 -3px 0 var(--access)}
  .seat.bayslot{background:#e6f7f7;border-color:var(--access);color:#0f7d7d;
    box-shadow:inset 3px 0 0 var(--access)}
  .seat.aisle-gap{background:transparent;border:0;width:14px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;align-items:center}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:3px;
    border:1px solid #cfd6de;vertical-align:-2px;margin-right:4px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);
    background:rgba(35,45,58,.92);color:#fff;padding:9px 20px;border-radius:7px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.on{opacity:1}
  .paxline{font-size:12.5px;display:flex;gap:8px;padding:3px 0;
    border-bottom:1px dashed var(--line)}
  .paxline .nm{flex:1}
  /* 提交订单面板里的乘车人勾选行 */
  /* ---- 组单步进器 ---- */
  .grouptitle{display:flex;align-items:center;gap:8px;font-size:12.5px;
    font-weight:600;color:#3b4a5a;margin:2px 0 6px}
  .steppers{display:flex;flex-direction:column;gap:5px}
  .stepper{display:flex;align-items:center;gap:8px;font-size:12.5px;
    padding:3px 0;border-bottom:1px dashed var(--line)}
  .stepper .sname{flex:1;display:flex;flex-direction:column;line-height:1.35}
  .stepper .sname .hint{font-size:11px}
  .stepper .sctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stepper .sval{min-width:22px;text-align:center;font-weight:700;
    font-variant-numeric:tabular-nums}
  .bandcell{display:inline-flex;align-items:center;gap:3px}
  .bandcell .bandname{font-size:10.5px;color:var(--muted);margin-right:2px}
  .specialbox{display:none}
  .specialbox.on{display:block}
  .ssection{padding:8px 0 4px;border-top:1px dashed var(--line)}
  .ssection .stitle{font-size:12px;font-weight:600;color:#4a5a6a;
    margin-bottom:5px;display:flex;gap:8px;align-items:baseline}
  .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;
    background:#eef4fd;color:var(--blue-d);border:1px solid #d8e7fa}
  .tag.q{background:#f3f0fd;color:var(--quiet);border-color:#e2ddfa}
</style>
</head>
<body>
<div class="topbar">
  <h1>开发者模式 · 后台管理与测试</h1>
  <div class="nav">
    <a href="/ticket">用户模式</a>
    <a href="/dev" class="active">开发者模式</a>
    <a href="/">座位图工具</a>
    <a href="/acceptance">验收台</a>
    <span id="conn" style="color:#c9d6e4;font-size:12px"></span>
  </div>
</div>

<div class="wrap">
  <!-- 概览 -->
  <div class="card">
    <h2>概览 <span class="hint" id="trainCode"></span>
      <span style="margin-left:auto"></span>
      <button class="btn danger small" id="btnReset">重置系统</button>
    </h2>
    <div class="body">
      <div class="metrics" id="metrics"></div>
    </div>
  </div>

  <div class="grid2">
    <div>
      <!-- 全局座位图 -->
      <div class="card">
        <h2>全局座位图 <span class="hint">16 节编组 · 点击座位可手动锁定/解锁</span></h2>
        <div class="body">
          <div class="legend" style="margin-bottom:10px">
            <span><i style="background:#fff"></i>可选</span>
            <span><i style="background:#9fb2c6"></i>用户已售</span>
            <span><i style="background:#d9c7a8"></i>手动锁定</span>
            <span><i style="background:#c9d4e0"></i>预设占用</span>
            <span><i style="border:2px solid var(--quiet)"></i>静音车厢</span>
            <span><i style="background:#e6f7f7;border-color:var(--access)"></i>近轮椅位</span>
          </div>
          <div class="hint" id="baySummary" style="margin-bottom:6px"></div>
          <div id="bayList" style="margin-bottom:10px"></div>
          <div id="carriages"><div class="hint">加载中…</div></div>
        </div>
      </div>
    </div>

    <div>
      <!-- 模拟余票 -->
      <div class="card">
        <h2>模拟余票 <span class="hint">调整后实时影响用户模式</span></h2>
        <div class="body" id="sliders"></div>
      </div>
      <!-- 提交订单：按**基础分组人数**组单。
           需求："我需要添加任意数量的成人什么的" —— 所以这里是
           加减数量的步进器，而不是勾选姓名（人名在这里没有意义）。

           口径：**基础分组管总人数**（成人/青少年/儿童/幼儿/婴儿），
           特殊人群（残疾/孕妇/儿童细分）是在基础分组上叠加的**独立维度**，
           不改变总人数 —— 与 smartrail/composition.py 完全一致。 -->
      <div class="card">
        <h2>提交订单 <span class="hint">按基础分组加人数 → 需要时叠加特殊人群 → 提交</span></h2>
        <div class="body">
          <div class="row" style="margin-bottom:8px">
            <label class="hint" style="width:52px">席别</label>
            <select id="orderClass" style="flex:1;padding:5px 8px;border:1px solid var(--line);
              border-radius:6px;font-family:inherit;font-size:13px"></select>
            <button class="btn ghost small" id="btnPickNone">清空</button>
          </div>

          <div class="grouptitle">基础分组
            <span class="hint" id="totalHint">共 0 人</span></div>
          <div id="baseGroups" class="steppers"></div>

          <div class="grouptitle" style="margin-top:10px">
            特殊人群<span class="hint">叠加在基础分组之上，不改变总人数</span>
            <button class="btn ghost small" id="btnSpecialToggle"
              style="margin-left:auto">展开 ▾</button></div>
          <div id="specialBox" class="specialbox"></div>

          <div class="row" style="margin-top:12px">
            <button class="btn" id="btnSubmitOrder" data-testid="submit-order">
              提交订单</button>
            <span class="hint">同一订单默认坐一起；凑不出连座时自动分票</span>
          </div>
          <div id="orderResult" style="margin-top:10px"></div>
        </div>
      </div>
      <!-- 快速压测 -->
      <div class="card">
        <h2>快速压测</h2>
        <div class="body">
          <div class="row">
            <button class="btn ghost small" data-fill="0">空车</button>
            <button class="btn ghost small" data-fill="0.3">三成</button>
            <button class="btn ghost small" data-fill="0.6">六成</button>
            <button class="btn ghost small" data-fill="0.85">八成五</button>
            <button class="btn ghost small" data-fill="1">满座</button>
          </div>
          <div class="hint" style="margin-top:8px">
            占用**按真实售票打散**（不是从排头顺序占），这样余票是碎片化的，
            「凑不出连座 → 自动分票」才会被真实触发。
          </div>
          <div class="hint" id="fragInfo" style="margin-top:6px"></div>
        </div>
      </div>
      <!-- 订单 -->
      <div class="card">
        <h2>用户下单记录 <span class="hint" id="orderCount"></span></h2>
        <div class="body" id="orders"><div class="hint">还没有订单。</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const response = await fetch(path, options);
  const text = await response.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch (e) { payload = null; }
  if (!response.ok) {
    throw new Error((payload && payload.detail) || `HTTP ${response.status}`);
  }
  return payload;
}
function post(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
}
let toastTimer = null;
function toast(message) {
  const box = $("toast");
  box.textContent = message;
  box.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("on"), 2400);
}
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

let snapshot = null;
let pendingTimers = {};

function seatClass(seat) {
  if (!seat.occupied) return seat.bay_slot ? "bayslot" : "";
  if (seat.source === "sold") return "sold";
  if (seat.source === "manual") return "manual";
  return "preset";
}

function renderMetrics() {
  const total = snapshot.total_seats;
  const occupied = snapshot.occupied_count;
  const sold = snapshot.seats.filter((s) => s.source === "sold").length;
  const manual = snapshot.seats.filter((s) => s.source === "manual").length;
  const preset = snapshot.seats.filter((s) => s.source === "preset").length;
  $("metrics").innerHTML = `
    <span class="metric"><div class="k">全列定员</div><div class="v">${total}</div></span>
    <span class="metric"><div class="k">已占用</div><div class="v">${occupied}</div></span>
    <span class="metric"><div class="k">用户已售</div>
      <div class="v" style="color:var(--blue-d)">${sold}</div></span>
    <span class="metric"><div class="k">手动锁定</div>
      <div class="v" style="color:#8a7550">${manual}</div></span>
    <span class="metric"><div class="k">预设占用</div>
      <div class="v" style="color:#5a6a7c">${preset}</div></span>
    <span class="metric"><div class="k">剩余</div>
      <div class="v" style="color:var(--ok)">${total - occupied}</div></span>
    <span class="metric"><div class="k">上座率</div>
      <div class="v">${(occupied / total * 100).toFixed(1)}%</div></span>`;
}

function renderCarriages() {
  const byCar = {};
  snapshot.seats.forEach((seat) => {
    (byCar[seat.carriage] = byCar[seat.carriage] || []).push(seat);
  });
  $("carriages").innerHTML = snapshot.carriages.map((car) => {
    const seats = byCar[car.number] || [];
    const rows = {};
    seats.forEach((s) => { (rows[s.row] = rows[s.row] || []).push(s); });
    const rowNos = Object.keys(rows).map(Number).sort((a, b) => a - b);
    const columns = car.columns;
    const grid = rowNos.map((row) => {
      const inRow = {};
      rows[row].forEach((s) => { inRow[s.col] = s; });
      const cells = columns.map((col) => {
        const seat = inRow[col];
        if (!seat) return '<span class="seat aisle-gap"></span>';
        const cls = ["seat", seatClass(seat)];
        if (seat.quiet) cls.push("quiet");
        if (seat.accessible) cls.push("access");
        const title = [
          seat.seat_id, seat.class_code,
          seat.bay_slot ? "★ 紧邻轮椅固定停放位（该座位仍为普通座位，可正常发售）" : "",
          seat.occupied ? `已占用（${seat.source}${seat.order_id ? " " + seat.order_id : ""}${
            seat.passenger_name ? " " + seat.passenger_name : ""}）` : "可选",
          seat.quiet ? "静音车厢" : "",
        ].filter(Boolean).join(" · ");
        return `<span class="${cls.join(" ")}" data-seat="${esc(seat.seat_id)}"
          title="${esc(title)}">${esc(seat.col)}</span>`;
      }).join("");
      return `<div class="srow"><span class="rno">${row}</span>${cells}</div>`;
    }).join("");
    const printed = [];
    if (car.quiet) printed.push('<span class="tag q">静音车厢</span>');
    if (car.accessible) printed.push('<span class="tag">带残疾人卫生间</span>');
    if (car.wheelchair_bays) {
      printed.push(`<span class="tag" style="background:#e6f7f7;border-color:#a9dede;
        color:#0f7d7d">轮椅停放位 ${car.wheelchair_bays}</span>`);
    }
    return `<div class="car">
      <div class="car-head">
        <b>${String(car.number).padStart(2, "0")}车</b>
        <span class="hint">${esc(car.class_summary || car.class_code)}
          · ${car.rows} 排 · ${columns.join("")}</span>
        ${printed.join("")}
        <span class="hint" style="margin-left:auto">
          定员 ${car.total} ／ 余 ${car.remaining}</span>
      </div>
      <div class="car-body"><div class="seatgrid">${grid}</div></div>
    </div>`;
  }).join("");
  $("carriages").querySelectorAll(".seat[data-seat]").forEach((node) => {
    node.onclick = () => toggleSeat(node.dataset.seat);
  });
}

function renderSliders() {
  const classes = Object.keys(snapshot.remaining);
  const totals = {};
  snapshot.seats.forEach((s) => {
    totals[s.class_code] = (totals[s.class_code] || 0) + 1;
  });
  $("sliders").innerHTML = classes.map((name) => {
    const left = snapshot.remaining[name];
    const total = totals[name];
    return `<div class="slider">
      <span class="nm">${esc(name)}</span>
      <input type="range" min="0" max="${total}" value="${left}"
        data-class="${esc(name)}">
      <span class="val" id="val-${esc(name)}">${left}</span>
      <span class="total">/ ${total}</span>
    </div>`;
  }).join("") + `<div class="hint" style="margin-top:6px">
    拖动滑块设定该席别余票；实现方式是占用/释放最靠前的座位，
    所以座位图上会看到"前面一段被标为手动锁定"。</div>`;
  $("sliders").querySelectorAll("input[type=range]").forEach((node) => {
    node.oninput = () => {
      const name = node.dataset.class;
      $("val-" + name).textContent = node.value;
      clearTimeout(pendingTimers[name]);
      pendingTimers[name] = setTimeout(() => applyRemaining(name, node.value), 220);
    };
  });
}

async function applyRemaining(classCode, value) {
  try {
    await post("/api/dev/remaining", { class_code: classCode, remaining: Number(value) });
    await refresh();
    toast(`${classCode} 余票设为 ${value}`);
  } catch (error) {
    toast("设置失败：" + error.message);
  }
}

async function toggleSeat(seatId) {
  try {
    const target = snapshot.seats.find((s) => s.seat_id === seatId);
    if (target && target.source === "sold") {
      toast("该座位是用户已售，不能手动解锁");
      return;
    }
    await post("/api/dev/seat/toggle", { seat_id: seatId });
    await refresh();
  } catch (error) {
    toast("操作失败：" + error.message);
  }
}

function renderOrders() {
  const orders = snapshot.orders || [];
  $("orderCount").textContent = orders.length ? `共 ${orders.length} 单` : "";
  const box = $("orders");
  if (!orders.length) {
    box.innerHTML = '<div class="hint">还没有订单。去用户模式下单后会实时出现在这里。</div>';
    return;
  }
  box.innerHTML = orders.slice().reverse().map((order) => `
    <div style="margin-bottom:11px">
      <div class="row" style="gap:6px">
        <b style="font-size:13px">${esc(order.order_id)}</b>
        <span class="tag">${esc(order.class_code)}</span>
        ${order.split ? '<span class="tag q">自动分票</span>' : ""}
        <span class="hint" style="margin-left:auto">${esc(order.rows.join("、"))}</span>
      </div>
      ${order.passengers.map((p) => `
        <div class="paxline">
          <span class="nm">${esc(p.name)}</span>
          <span>${esc(p.seat_id || "候补")}</span>
          <span style="color:${p.quiet ? "var(--quiet)" : "var(--muted)"}">
            ${p.quiet ? "静音" : ""}</span>
        </div>`).join("")}
    </div>`).join("");
}

// ---- 提交订单：按基础分组人数组单 ----
//
// 需求："我需要添加任意数量的成人什么的"。所以这里不是勾选姓名，
// 而是给基础分组加减数量。人名对下单没有意义。
//
// 口径与 smartrail/composition.py 一致：基础分组管总人数，
// 特殊人群（残疾/孕妇/儿童细分）是叠加维度，不计入总人数。
let compositionSchema = null;
let baseCounts = {};      // {adult: 2, child: 1, ...}
let disabilityCounts = {}; // {"severe|adult": 1, ...}
let pregnantCounts = {};   // {"term|adult": 1, ...}
let childSubCounts = {};   // {child_quiet: 1, ...}

async function loadCompositionSchema() {
  const schema = await api("/api/composition/schema");
  compositionSchema = schema;
  baseCounts = {};
  (schema.base_groups || []).forEach((g) => { baseCounts[g.id] = 0; });
  childSubCounts = {};
  (schema.child_sub_groups || []).forEach((g) => { childSubCounts[g.id] = 0; });
  disabilityCounts = {};
  (schema.disability_levels || []).forEach((lv) => {
    (schema.age_bands || []).forEach((band) => {
      disabilityCounts[`${lv.id}|${band.id}`] = 0;
    });
  });
  pregnantCounts = {};
  (schema.pregnant_stages || []).forEach((st) => {
    (schema.age_bands || []).forEach((band) => {
      pregnantCounts[`${st.id}|${band.id}`] = 0;
    });
  });
  renderBaseGroups();
  renderSpecialBox();
  updateTotalHint();
}

function totalPeople() {
  return Object.values(baseCounts).reduce((sum, n) => sum + n, 0);
}

function specialPeople() {
  const disability = Object.values(disabilityCounts)
    .reduce((sum, n) => sum + n, 0);
  const pregnant = Object.values(pregnantCounts).reduce((sum, n) => sum + n, 0);
  return disability + pregnant;
}

function updateTotalHint() {
  if (!$("totalHint")) return;
  const total = totalPeople();
  const extra = specialPeople();
  $("totalHint").textContent = `共 ${total} 人`
    + (extra ? `（其中 ${extra} 位标注了特殊人群，不计入总人数）` : "");
}

function stepper(label, desc, value, onChange, testid) {
  const row = document.createElement("div");
  row.className = "stepper";
  row.setAttribute("data-testid", testid);
  row.innerHTML = `
    <span class="sname">${esc(label)}<span class="hint">${esc(desc)}</span></span>
    <span class="sctl">
      <button class="btn ghost small" data-delta="-1"
        ${value <= 0 ? "disabled" : ""}>−</button>
      <span class="sval">${value}</span>
      <button class="btn ghost small" data-delta="1"
        ${value >= 99 ? "disabled" : ""}>+</button>
    </span>`;
  row.querySelectorAll("button[data-delta]").forEach((button) => {
    button.onclick = () => onChange(Number(button.dataset.delta));
  });
  return row;
}

function renderBaseGroups() {
  const box = $("baseGroups");
  if (!box || !compositionSchema) return;
  box.innerHTML = "";
  (compositionSchema.base_groups || []).forEach((group) => {
    box.appendChild(stepper(
      group.label, group.desc, baseCounts[group.id] || 0,
      (delta) => {
        baseCounts[group.id] = Math.max(
          0, Math.min(99, (baseCounts[group.id] || 0) + delta));
        renderBaseGroups();
        updateTotalHint();
      },
      `base-${group.id}`,
    ));
  });
}

function section(title, hint, rows) {
  const wrap = document.createElement("div");
  wrap.className = "ssection";
  wrap.innerHTML = `<div class="stitle">${esc(title)}
    <span class="hint">${esc(hint)}</span></div>`;
  rows.forEach((row) => wrap.appendChild(row));
  return wrap;
}

function renderSpecialBox() {
  const box = $("specialBox");
  if (!box || !compositionSchema) return;
  box.innerHTML = "";
  const bands = compositionSchema.age_bands || [];

  // 儿童细分：安静 / 吵闹（基础分组"儿童"之上的维度）
  box.appendChild(section("儿童细分", "叠加在「儿童」之上，不改变总人数",
    (compositionSchema.child_sub_groups || []).map((group) => stepper(
      group.label, "儿童 4-14 岁", childSubCounts[group.id] || 0,
      (delta) => {
        childSubCounts[group.id] = Math.max(
          0, Math.min(99, (childSubCounts[group.id] || 0) + delta));
        renderSpecialBox();
      },
      `childsub-${group.id}`,
    ))));

  // 残疾：程度 × 年龄段
  box.appendChild(section("残疾旅客", "程度 × 年龄段，按年龄段叠加到基础分组",
    (compositionSchema.disability_levels || []).map((level) => {
      const row = document.createElement("div");
      row.className = "stepper";
      row.setAttribute("data-testid", `disability-${level.id}`);
      const tags = level.requires_key_service ? "需重点旅客服务" : "无需重点服务";
      const companion = level.requires_companion ? " · 需陪同" : "";
      row.innerHTML = `<span class="sname">${esc(level.label)}残疾
        <span class="hint">${esc(tags + companion)}</span></span>
        <span class="sctl"></span>`;
      const ctl = row.querySelector(".sctl");
      bands.forEach((band) => {
        const key = `${level.id}|${band.id}`;
        const cell = document.createElement("span");
        cell.className = "bandcell";
        cell.setAttribute("data-testid", `disability-${level.id}-${band.id}`);
        const value = disabilityCounts[key] || 0;
        cell.innerHTML = `<span class="bandname">${esc(band.label)}</span>
          <button class="btn ghost small" data-delta="-1"
            ${value <= 0 ? "disabled" : ""}>−</button>
          <span class="sval">${value}</span>
          <button class="btn ghost small" data-delta="1"
            ${value >= 99 ? "disabled" : ""}>+</button>`;
        cell.querySelectorAll("button[data-delta]").forEach((button) => {
          button.onclick = () => {
            disabilityCounts[key] = Math.max(
              0, Math.min(99, (disabilityCounts[key] || 0)
                + Number(button.dataset.delta)));
            renderSpecialBox();
            updateTotalHint();
          };
        });
        ctl.appendChild(cell);
      });
      return row;
    })));

  // 孕妇：孕期 × 年龄段
  box.appendChild(section("孕妇", "孕期 × 年龄段，按年龄段叠加到基础分组",
    (compositionSchema.pregnant_stages || []).map((stage) => {
      const row = document.createElement("div");
      row.className = "stepper";
      row.setAttribute("data-testid", `pregnant-${stage.id}`);
      const tags = stage.requires_key_service ? "需重点旅客服务" : "无需重点服务";
      const companion = stage.requires_companion ? " · 需陪同" : "";
      const configurable = stage.configurable ? " · 平台可配置" : "";
      row.innerHTML = `<span class="sname">孕${esc(stage.label)}
        <span class="hint">${esc(tags + companion + configurable)}</span></span>
        <span class="sctl"></span>`;
      const ctl = row.querySelector(".sctl");
      bands.forEach((band) => {
        const key = `${stage.id}|${band.id}`;
        const cell = document.createElement("span");
        cell.className = "bandcell";
        cell.setAttribute("data-testid", `pregnant-${stage.id}-${band.id}`);
        const value = pregnantCounts[key] || 0;
        cell.innerHTML = `<span class="bandname">${esc(band.label)}</span>
          <button class="btn ghost small" data-delta="-1"
            ${value <= 0 ? "disabled" : ""}>−</button>
          <span class="sval">${value}</span>
          <button class="btn ghost small" data-delta="1"
            ${value >= 99 ? "disabled" : ""}>+</button>`;
        cell.querySelectorAll("button[data-delta]").forEach((button) => {
          button.onclick = () => {
            pregnantCounts[key] = Math.max(
              0, Math.min(99, (pregnantCounts[key] || 0)
                + Number(button.dataset.delta)));
            renderSpecialBox();
            updateTotalHint();
          };
        });
        ctl.appendChild(cell);
      });
      return row;
    })));
}

function buildComposition() {
  const disability = {};
  (compositionSchema.disability_levels || []).forEach((level) => {
    const row = {};
    (compositionSchema.age_bands || []).forEach((band) => {
      row[band.id] = disabilityCounts[`${level.id}|${band.id}`] || 0;
    });
    disability[level.id] = row;
  });
  const pregnant = {};
  (compositionSchema.pregnant_stages || []).forEach((stage) => {
    const row = {};
    (compositionSchema.age_bands || []).forEach((band) => {
      row[band.id] = pregnantCounts[`${stage.id}|${band.id}`] || 0;
    });
    pregnant[stage.id] = row;
  });
  return {
    note: "开发者模式组单",
    class_code: $("orderClass").value,
    base: { ...baseCounts },
    child_sub: { ...childSubCounts },
    disability,
    pregnant,
  };
}

async function submitOrder() {
  const box = $("orderResult");
  if (!compositionSchema) {
    box.innerHTML = `<div class="hint" style="color:var(--bad)">
      组单口径尚未加载完成。</div>`;
    return;
  }
  if (totalPeople() === 0) {
    box.innerHTML = `<div class="hint" style="color:var(--bad)">
      请先给基础分组加人数（成人 / 青少年 / 儿童 / 幼儿 / 婴儿）。</div>`;
    return;
  }
  try {
    const body = await post("/api/composition/submit",
      { orders: [buildComposition()] });
    const order = (body.orders || [])[0] || {};
    const check = order.check || {};
    const blocked = (body.blocked || [])[0];
    if (blocked) {
      box.innerHTML = `<div class="hint" style="color:var(--bad)">
        被拦下（未进入求解器）：${esc((blocked.check.errors || []).join("；"))}</div>`;
      return;
    }
    const info = order.info || {};
    const seats = Object.entries(order.seats || {}).map(([pid, seat]) =>
      `<div class="paxline"><span class="nm">${esc(pid)}</span>
        <span class="tag">${esc(seat)}</span></div>`).join("");
    box.innerHTML = `
      <div class="hint" style="margin-bottom:6px">
        订单 ${esc(order.order_id || "")} ·
        ${order.total_passengers || 0} 人 ·
        可用健康成人 ${check.healthy_adults ?? "-"} ·
        所需陪同 ${check.required_companions ?? "-"} ·
        ${order.level_label ? esc(order.level_label) : ""}</div>
      <div class="hint" style="margin-bottom:6px">
        基础分组：${esc(Object.entries(info.base || {})
          .filter(([, n]) => n).map(([k, n]) => `${k}×${n}`).join(" ") || "无")}
        ${info.total_excluded
          ? `｜叠加维度 ${info.total_excluded} 人不计入总人数` : ""}</div>
      ${seats}
      ${(order.reasons || []).slice(0, 3).map((r) =>
        `<div class="hint">${esc(r)}</div>`).join("")}`;
    await refresh();
    await renderOrders();
  } catch (error) {
    box.innerHTML = `<div class="hint" style="color:var(--bad)">
      提交失败：${esc(error.message)}</div>`;
  }
}

async function refresh() {
  snapshot = await api("/api/dev/snapshot");
  $("trainCode").textContent = `车次 ${snapshot.train_code} · 定员 ${snapshot.total_seats}`;
  renderMetrics();
  renderCarriages();
  renderSliders();
  renderOrders();
  const bays = snapshot.wheelchair_bays || {};
  if ($("baySummary")) {
    $("baySummary").textContent =
      `轮椅固定停放位 ${bays.total} 个（04 车、12 车各 2 个）· `
      + `空 ${bays.free} 个 · 已占 ${bays.occupied} 个。`
      + `停放位**独立编号**（如 04车W1）且**不占座位票额**；满位后可经确认改出普通坐票。`;
  }
  if ($("bayList")) {
    $("bayList").innerHTML = (bays.bays || []).map((bay) => `
      <div class="paxline" data-testid="bay-${esc(bay.bay_id)}">
        <span style="width:74px;font-weight:700;
          color:${bay.occupied ? "var(--bad)" : "var(--access)"}">
          ${esc(bay.bay_id)}</span>
        <span class="tag" style="background:#e6f7f7;border-color:#a9dede;color:#0f7d7d">
          ${bay.carriage} 车</span>
        <span class="nm">${bay.occupied
          ? esc(bay.passenger_name || "已占用")
          : "空闲"}</span>
        <span class="hint">${bay.occupied
          ? esc(bay.order_id || "") : "可分配给轮椅旅客"}</span>
      </div>`).join("");
  }
}

async function boot() {
  const classOptions = ["二等座", "一等座", "商务座"];
  $("orderClass").innerHTML = classOptions
    .map((c) => `<option value="${c}">${c}</option>`).join("");
  $("btnSubmitOrder").onclick = submitOrder;
  $("btnPickNone").onclick = () => {
    Object.keys(baseCounts).forEach((k) => { baseCounts[k] = 0; });
    Object.keys(childSubCounts).forEach((k) => { childSubCounts[k] = 0; });
    Object.keys(disabilityCounts).forEach((k) => { disabilityCounts[k] = 0; });
    Object.keys(pregnantCounts).forEach((k) => { pregnantCounts[k] = 0; });
    renderBaseGroups();
    renderSpecialBox();
    updateTotalHint();
  };
  $("btnSpecialToggle").onclick = () => {
    const open = $("specialBox").classList.toggle("on");
    $("btnSpecialToggle").textContent = open ? "收起 ▴" : "展开 ▾";
  };
  $("btnReset").onclick = async () => {
    if (!confirm("重置系统：清空所有订单与座位占用，乘车人恢复预制状态。继续？")) return;
    await post("/api/dev/reset", { passengers: true });
    await refresh();
    toast("系统已重置");
  };
  document.querySelectorAll("button[data-fill]").forEach((button) => {
    button.onclick = async () => {
      const result = await post("/api/dev/fill",
        { ratio: Number(button.dataset.fill) });
      await refresh();
      toast(`已卖到 ${(Number(button.dataset.fill) * 100).toFixed(0)}%`);
      if ($("fragInfo") && result.fragmentation) {
        const frag = result.fragmentation["二等座"] || result.fragmentation;
        $("fragInfo").textContent =
          `当前余票碎片化：最长连座 ${frag.longest_run}，`
          + `≥2 连座 ${frag.runs_at_least_2} 处，`
          + `≥3 连座 ${frag.runs_at_least_3} 处 —— `
          + `最长连座越小人越多，越会触发自动分票。`;
      }
    };
  });
  try {
    await refresh();
    await loadCompositionSchema();
    $("conn").textContent = "已连接";
  } catch (error) {
    $("conn").textContent = "未连接";
    toast("初始化失败：" + error.message);
  }
}
boot();
</script>
</body>
</html>
